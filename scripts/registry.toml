[scripts.install]
category = "deploy"
summary = "Install and start a node on a host with Docker: mint secrets, resolve the latest release, start, wait for health, print the admin key."
run = "curl -fsSLO https://openhardwaremanager.org/install.sh && sha256sum -c install.sh.sha256 && sh install.sh"
mutates = true
# Shipped as a checksummed release asset by the github-release job, and served
# at openhardwaremanager.org/install.sh by frontend/app/install.sh/route.ts.
used_by = [".github/workflows/release.yml", "frontend/app/install.sh/route.ts"]

