mutates = true
# `used_by` previously named deploy/providers/gcp/ and scripts/deploy_cloud_run.sh.
# Neither references this script — not in the shell script, the provider
# modules, the Makefile, CI, or the docs. The claim propagated into the #372
# decision record as "load-bearing for the GCP deploy path", which it is not.
# It is a manual entry point, so the list is empty rather than wrong.
used_by = []

