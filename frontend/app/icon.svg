<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Open Hardware Manager">
  <!-- Same geometry as components/layout/Logo.tsx, which is the source of
       truth: an opened hex nut whose interior is a supply graph. That component
       reads the token ramp directly, but a standalone favicon cannot resolve
       CSS variables, so these stops mirror the dark ttm-irid ramp and the two
       files must be changed together. The dark ground is baked in so the mark
       reads on a dark tab strip. -->
  <defs>
    <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="30%" stop-color="#fecfef" />
      <stop offset="60%" stop-color="#a1c4fd" />
      <stop offset="100%" stop-color="#d4fc79" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0f0b08" />
  <g transform="translate(16 16) scale(0.86) translate(-16 -16)">
    <path
      d="M19.4 3.2 L27.4 8.0 V24.0 L16 29.6 L4.6 24.0 V8.0 L12.6 3.2"
      fill="none"
      stroke="url(#pearl)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M16 12 L10.6 21 M16 12 L21.4 21"
      fill="none"
      stroke="url(#pearl)"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <circle cx="16" cy="11.4" r="3.1" fill="url(#pearl)" />
    <circle cx="10.3" cy="21.4" r="2.7" fill="url(#pearl)" />
    <circle cx="21.7" cy="21.4" r="2.7" fill="url(#pearl)" />
  </g>
</svg>
