site_name: "Open Hardware Manager (OHM) — Developer Docs"
site_description: "Developer/agent corpus. User-facing product docs: docs-site/"

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotation
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Architecture:
    - Federation MVP ADR: architecture/federation-mvp-adr.md
    - Facility claim ladder ADR: architecture/facility-claim-ladder-adr.md
    - Process Taxonomy ADR: architecture/process-taxonomy-adr.md
    - File type taxonomy ADR: architecture/file-type-taxonomy-adr.md
    - Identity Model: architecture/identity-model.md
    - Security Modes: architecture/security-modes.md
    - Source Platforms: architecture/source-platforms.md
  - Ops:
    - Federation Infra: ops/federation-infra.md
    - Rule Design: ops/rule-design.md
    - Release: RELEASE.md
  - Adapters:
    - MSF Datasheet: adapters/msf-datasheet.md
    - OKH-LOSH TOML: adapters/okh-losh-toml.md
