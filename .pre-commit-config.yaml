repos:
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: ["--config=pyproject.toml"]

# No hook here mutates the worktree, and none should.
#
# pre-commit stashes unstaged changes before running hooks; a hook that rewrites
# a tracked file the stash also touches makes the restore conflict, and
# pre-commit rolls back — leaving the changes only in ~/.cache/pre-commit/patch*.
# That destroyed seven files of uncommitted work once. Formatters that rewrite
# only what is already staged are fine; a generator that rewrites a file from
# the whole worktree is not.
