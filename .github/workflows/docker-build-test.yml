name: Docker Build and Test

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: supply-graph-ai

jobs:
  docker-test:
    name: Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read expected version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "expected=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Expected app version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:test
          build-args: |
            APP_VERSION=${{ steps.version.outputs.expected }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d \
            --name test-container \
            -p 8001:8001 \
            -e ENVIRONMENT=test \
            -e LOG_LEVEL=INFO \
            -e STORAGE_PROVIDER=local \
            -e LLM_ENABLED=false \
            ${{ env.IMAGE }}:test

      - name: Wait for container to be ready
        run: |
          timeout=60
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8001/health > /dev/null 2>&1; then
              echo "Container is ready"
              exit 0
            fi
            echo "Waiting for container... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Container failed to start within $timeout seconds"
          # Guarded for the same reason as the diagnostic step below: if the
          # container is absent, an unguarded `docker logs` aborts the step on
          # its own exit code and the deliberate `exit 1` — and the reason for
          # it — never runs.
          docker logs test-container 2>&1 || echo "(no container to log)"
          exit 1

      # What `docker ps` tells an operator, as opposed to whether the app
      # answers a curl. The two can disagree — see the script's header.
      - name: Container reports healthy
        run: sh scripts/wait_container_healthy.sh test-container

      - name: Run health checks
        run: |
          EXPECTED="${{ steps.version.outputs.expected }}"
          BODY=$(curl -sf http://localhost:8001/health)
          echo "$BODY"
          ACTUAL=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "version=$ACTUAL (expected $EXPECTED)"
          test "$ACTUAL" = "$EXPECTED"
          curl -f http://localhost:8001/health/liveness
          curl -f http://localhost:8001/health/readiness || echo "Readiness check returned non-zero (expected in test environment)"

      - name: Test metrics endpoint
        run: |
          curl -f http://localhost:8001/v1/api/utility/metrics?format=json
          curl -f http://localhost:8001/v1/api/utility/metrics?format=prometheus

      - name: Check container logs
        if: failure()
        run: |
          # Diagnostic only: it must never decide the job's outcome, and must
          # never stop before printing everything it can. `docker logs` exits
          # non-zero when the container does not exist, which happens whenever
          # the build failed earlier — and without these guards this step then
          # replaced the real error (a Docker Hub pull timeout) with
          # "No such container: test-container", and skipped `docker ps -a`
          # on the way out. The Cleanup step below already guards the same way.
          echo "=== Container Logs ==="
          docker logs test-container 2>&1 \
            || echo "(no container — it never started; the real failure is above)"
          echo "=== Container Status ==="
          docker ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true

  # The web image, which nothing here built before. It shipped in 0.12.2
  # reporting "unhealthy" for its whole life while serving normally, and no gate
  # noticed because none of them looked at it: its HEALTHCHECK probed
  # `localhost`, which resolves to ::1 first, against a server listening on IPv4
  # only.
  #
  # No docs site is built first. The Dockerfile only needs `docs-dist/` to
  # exist, and its tracked .gitkeep guarantees that; the health check does not
  # depend on what the docs route serves.
  frontend-image:
    name: Test frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: ohm-frontend:test
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # The upstream is never called: /healthz answers without it. It only has
      # to be set, because entry.sh refuses to start without one.
      - name: Start it
        run: |
          docker run -d --name test-frontend -p 8080:8080 \
            -e API_UPSTREAM_URL=http://127.0.0.1:1 \
            ohm-frontend:test

      - name: Container reports healthy
        run: sh scripts/wait_container_healthy.sh test-frontend

      - name: Serves the health endpoint from the host
        run: curl -fsS http://localhost:8080/healthz

      - name: Cleanup
        if: always()
        run: docker rm -f test-frontend || true

  # The install path an operator actually takes: the real scripts/install.sh, run
  # against images built from this commit, then the node it produced is used.
  #
  # Every defect in the 0.12.2 clean-box install log shipped because CI tested
  # things an operator never runs and never ran the thing they do. This job
  # catches, in one run: a container that serves normally but reports unhealthy,
  # an identity that cannot be minted (the key store defaulted under a home the
  # image does not create), keys that do not survive recreating the container,
  # and the API published on every interface. See scripts/install_check.sh for
  # the checks and why the images are served from a throwaway local registry.
  #
  # `make install-check` runs the same thing locally.
  installer:
    name: Installer end to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read the version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "expected=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ohm-check-api:local
          build-args: |
            APP_VERSION=${{ steps.version.outputs.expected }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: ohm-check-web:local
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Prints its own diagnostics (installer output, both containers' health
      # probes and logs) on failure, and tears everything down either way.
      - name: Install a node and use it
        env:
          OHM_CHECK_API_IMAGE: ohm-check-api:local
          OHM_CHECK_WEB_IMAGE: ohm-check-web:local
        run: sh scripts/install_check.sh

  # The self-host path, end to end. The job above proves one container answers
  # /health; it cannot see the failure that matters here, because a broken async
  # setup does not return an error — submissions are accepted and then sit in
  # PENDING forever with no worker to consume them.
  #
  # This exists because that failure shipped twice: once in production, and once
  # through `cp .env.example .env`, which Compose interpolates from and which
  # carried a schema default that silently disabled background import.
  compose-stack:
    name: Self-host stack (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tagged as the name docker-compose.yml resolves, so Compose uses this
      # build instead of pulling a published release. OHM_VERSION is what makes
      # that substitution possible without editing the file.
      - name: Build the API image under the tag Compose expects
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: touchthesun/openhardwaremanager:citest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Also exercises the env_file path: these reach the container only by
      # passthrough, because secrets are deliberately not listed in compose's
      # `environment:` block.
      - name: Write a .env the way a self-hoster would
        run: |
          {
            echo "GITHUB_ACCESS_TOKEN=${{ secrets.GITHUB_TOKEN }}"
            echo "ENVIRONMENT=development"
          } > .env

      # No frontend: it is not on the async path, and building it needs the docs
      # site built first. Redis starts on its own via depends_on.
      - name: Start the stack
        env:
          OHM_VERSION: citest
        run: docker compose up -d ohm-api ohm-worker

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8001/health > /dev/null 2>&1; then
              echo "API ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::API never became healthy"
          exit 1

      # A 400 here means jobs are unavailable — the regression this job exists
      # to catch. Anything else and we have a job id to follow.
      - name: Submit a real background import
        id: submit
        run: |
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            http://localhost:8001/v1/api/okh/generate-from-url/jobs \
            -H 'Content-Type: application/json' \
            -d '{"urls":["https://github.com/octocat/Hello-World"],"no_llm":true}')
          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -1)
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then
            echo "::error::Submission refused (HTTP $CODE). Async jobs are not available on this stack."
            exit 1
          fi
          JOB_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['jobs'][0]['job_id'])")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      # The actual point: a job that is accepted but never consumed stays
      # PENDING and reports no error, so only polling to a terminal state proves
      # a worker is running and reachable through the broker.
      - name: Poll it to completion
        run: |
          JOB_ID="${{ steps.submit.outputs.job_id }}"
          for i in $(seq 1 60); do
            BODY=$(curl -sS "http://localhost:8001/v1/api/okh/generate-from-url/jobs/$JOB_ID")
            STATE=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))")
            echo "[$i] $STATE"
            case "$STATE" in
              SUCCESS) echo "Background import completed."; exit 0 ;;
              FAILURE) echo "::error::Job failed"; echo "$BODY"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Job never reached a terminal state in 5 minutes — accepted but not consumed, which means no worker is taking work off the broker."
          exit 1

      - name: Stack logs
        if: failure()
        run: |
          echo "=== api ===";    docker compose logs --tail=120 ohm-api
          echo "=== worker ==="; docker compose logs --tail=120 ohm-worker
          echo "=== redis ===";  docker compose logs --tail=40 redis
          docker compose ps -a

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
