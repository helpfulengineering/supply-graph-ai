name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (format, lint, repo-map)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync environment and CI tools
        run: |
          uv sync --extra dev
          uv pip install ruff black

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Black format check
        run: uv run black --check src tests

      - name: Verify repository map is up to date
        run: uv run python scripts/generate_repo_map.py --check

      - name: Verify .env.example is up to date
        run: |
          uv run python scripts/generate_env_template.py
          git diff --exit-code .env.example

      - name: Verify version references are in sync
        run: uv run python scripts/bump_version.py --check

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Verify scripts registry is complete and current
        run: uv run python scripts/generate_scripts_index.py --check

  test:
    name: Test (stable CI subset)
    runs-on: ubuntu-latest
    needs: quality
    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      STORAGE_PROVIDER: local
      LLM_ENABLED: false
      RUN_AZURE_CHAIN_TESTS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install pytest-cov

      - name: Run unit lane
        run: |
          uv run pytest tests \
            -m "unit and not llm and not quarantine" \
            --maxfail=1 \
            --cov=src \
            --cov-report=xml

      - name: Run contract lane
        run: |
          uv run pytest tests \
            -m "contract and not llm and not quarantine" \
            --maxfail=1 \
            --cov=src \
            --cov-append \
            --cov-report=xml

      - name: Run integration lane
        run: |
          uv run pytest tests \
            -m "integration and not llm and not quarantine" \
            --ignore=tests/test_storage_to_okw_list_chain.py \
            --maxfail=1 \
            --cov=src \
            --cov-append \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  contract-stability:
    name: Contract Stability Guardrails
    runs-on: ubuntu-latest
    needs: quality
    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      STORAGE_PROVIDER: local
      LLM_ENABLED: false
      RUN_AZURE_CHAIN_TESTS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run contract stability suite
        run: |
          uv run pytest \
            tests/api/test_scaffold_cleanup_endpoint.py \
            tests/api/test_package_download_route.py \
            tests/cli/test_scaffold_cleanup_cli.py \
            tests/federation/test_federation_routes.py \
            -m "not llm and not quarantine" \
            --maxfail=1

  security:
    name: Security (dependency and static checks)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies and security tools
        run: |
          uv sync --extra dev
          uv pip install pip-audit bandit

      - name: Dependency vulnerability scan
        run: uv run pip-audit --skip-editable

      - name: Static security scan
        run: uv run bandit -q -r src -c pyproject.toml -x tests

  # The frontend gate had NO CI coverage: nothing ran typecheck, lint, unit
  # tests, the build, or the Playwright/a11y suite. That is how a unit test
  # broken by 0.10.2 sat red on main until someone happened to run the gate
  # locally, and it left the accessibility suite unenforced.
  #
  # Runs `frontend-ready`, the same single signal used locally and by the build
  # loop, so CI and a developer's machine agree on what "green" means.
  frontend:
    name: Frontend (typecheck, lint, unit, build, e2e + a11y + theme matrix)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only the browser the mocked lane drives; the full download is slow and
      # the other engines are unused.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # frontend-ready runs typecheck, lint, unit, build, then the mocked e2e
      # lane — which carries the 20-variant theme contrast matrix and the
      # chart-ramp distinctness check. The site layer is absent from this
      # environment on purpose: the default (disabled) deployment is what CI
      # must prove, and e2e/site-layer.spec.ts asserts it. The opposite posture
      # is proved by the site-layer-enabled job below; neither direction is
      # allowed to be the untested one.
      - name: frontend-ready
        run: npm run frontend-ready

      # Screenshots and traces are the difference between "a11y failed" and
      # knowing which element, which matters most for the runs nobody watched.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/artifacts/test-results
            frontend/artifacts/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  site-layer-enabled:
    name: Frontend (site layer enabled)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: frontend
    # The site layer defaults to OFF and the job above proves that posture. This
    # one proves the other, because "off is a first-class state" is a claim about
    # a PAIR — it only means something if the enabled direction is also known to
    # work. It was verified once by hand when the layer was written and then had
    # no gate, which is the condition under which a capability rots silently and
    # nobody finds out until the day they switch it on.
    #
    # The credentials are deliberately fake and point at a host that cannot
    # resolve (.invalid is reserved by RFC 2606). That is not a shortcut around
    # provisioning a project — it is the more interesting half of the contract.
    # docs/architecture/site-layer.md promises that an unreachable or
    # unprovisioned backend yields default gate copy rather than an error, and
    # lib/site/stack.ts backs that with a catch on every call plus a dormant flag
    # after the first failure. This job holds that promise to account. A live
    # project would test the happy path and quietly stop testing this one.
    env:
      # NEXT_PUBLIC_* are inlined at BUILD time, so these must be set for the
      # build, not merely for the test run.
      NEXT_PUBLIC_OHM_SUPABASE_URL: https://ci-stub.supabase.invalid
      NEXT_PUBLIC_OHM_SUPABASE_ANON_KEY: ci-stub-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Fails loudly if the build did not take the env. A green suite against a
      # disabled build proves nothing while looking exactly like proof, and that
      # is the one failure mode this job cannot be allowed to have.
      - name: Build, and confirm it is in the enabled posture
        run: |
          npm run build
          grep -rq "ci-stub.supabase.invalid" .next/static/chunks/ \
            || { echo "::error::site layer did not reach the client bundle — this job would be testing the disabled posture"; exit 1; }

      - name: e2e (site layer enabled)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-site-layer-enabled
          path: |
            frontend/artifacts/test-results
            frontend/artifacts/playwright-report
          retention-days: 7
          if-no-files-found: ignore
